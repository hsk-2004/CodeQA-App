# Full-Docker variant: Ollama itself also runs as a container, backed by a
# named volume so models persist across restarts (downloaded once only).
# Use this instead of docker-compose.yml when you have time for the initial
# ~3.7GB Ollama image pull. To run:
#   docker compose -f docker-compose.ollama.yml up --build -d
#   docker compose -f docker-compose.ollama.yml exec ollama ollama pull codellama:7b
#   docker compose -f docker-compose.ollama.yml exec ollama ollama pull nomic-embed-text

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  retrieval-service:
    build:
      context: .
      dockerfile: services/Dockerfile.retrieval
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_EMBED_URL=http://ollama:11434/api/embeddings
    depends_on:
      - ollama

  app-service:
    build:
      context: .
      dockerfile: services/Dockerfile.app
    ports:
      - "8000:8000"
    environment:
      - RETRIEVAL_SERVICE_URL=http://retrieval-service:8001/retrieve
      - OLLAMA_URL=http://ollama:11434/api/generate
    depends_on:
      - retrieval-service
      - ollama

volumes:
  ollama_data:
